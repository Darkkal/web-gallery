name: Release and Package

# GitHub mirror release: triggered by the `v*` tag that the maintainer-
# dispatched Cocogitto versioning workflow (.forgejo/workflows/version.yml)
# creates on Forgejo master and the one-way mirror propagates to GitHub. This
# workflow ONLY packages that same immutable tag for GitHub/GHCR so the two
# sides never compute competing versions. Never dispatch it manually for a
# version that has not been created by Cocogitto first.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build standalone binaries
        run: npm run build:release

      - name: Create release archives
        run: |
          VERSION=$(node -p "require('./package.json').version")
          tar -czf "web-gallery-v${VERSION}-linux-x64.tar.gz" -C dist "web-gallery-v${VERSION}-linux" setup-deps.sh
          tar -czf "web-gallery-v${VERSION}-macos-x64.tar.gz" -C dist "web-gallery-v${VERSION}-macos" setup-deps.sh
          zip -j "web-gallery-v${VERSION}-windows-x64.zip" "dist/web-gallery-v${VERSION}-win.exe" "dist/setup-deps.ps1"

      - name: Publish GitHub release with assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" \
            "web-gallery-v${VERSION}-linux-x64.tar.gz" \
            "web-gallery-v${VERSION}-macos-x64.tar.gz" \
            "web-gallery-v${VERSION}-windows-x64.zip" \
            --title "$TAG" --generate-notes \
          || gh release upload "$TAG" \
            "web-gallery-v${VERSION}-linux-x64.tar.gz" \
            "web-gallery-v${VERSION}-macos-x64.tar.gz" \
            "web-gallery-v${VERSION}-windows-x64.zip" \
            --clobber

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=semver,pattern={{major}},value=${{ github.ref_name }}
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
