name: Release (Forgejo)

# Forgejo is the release authority. Pushing to `master` runs Cocogitto
# (`cog bump --auto`), which computes the next SemVer from conventional commits,
# bumps package.json / package-lock.json, regenerates CHANGELOG.md and creates
# the vX.Y.Z tag + release commit. Because `master` is branch-protected, the
# release commit + tag are delivered via a **release PR** (release-please style)
# instead of a direct push to master; binary assets and the registry image are
# published against the tag.

on:
  push:
    branches: [master]
  # Manual trigger for troubleshooting: dispatches the build/publish path for
  # the selected ref's current version without creating a release branch/PR.
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # Decide whether a release is needed and what the next version is.
  plan:
    runs-on: ubuntu-latest
    outputs:
      next_version: ${{ steps.next.outputs.next_version }}
    steps:
      - name: Checkout (full history for Cocogitto)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Cocogitto
        run: |
          set -euo pipefail
          COG_VERSION=7.0.0
          curl -fsSL \
            "https://github.com/cocogitto/cocogitto/releases/download/${COG_VERSION}/cocogitto-${COG_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o /tmp/cog.tar.gz
          # The tarball nests the binary under its arch triple dir.
          COG_BIN="$(tar -tzf /tmp/cog.tar.gz | grep -E '(^|/)cog$' | head -1)"
          tar -xzf /tmp/cog.tar.gz -C /tmp
          install -Dm755 "/tmp/${COG_BIN}" /usr/local/bin/cog

      - name: Compute next version
        id: next
        run: |
          set -euo pipefail
          NEXT="$(cog bump --dry-run --auto 2>/dev/null || true)"
          NEXT="${NEXT%%[[:space:]]*}"
          CURRENT="$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null | sed 's/^v//')"
          echo "next=${NEXT} current=${CURRENT}"
          if [ -z "${NEXT}" ] || [ "${NEXT}" = "${CURRENT}" ]; then
            echo "No release needed"
            echo "next_version=" >> "$GITHUB_OUTPUT"
          else
            echo "next_version=${NEXT}" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: plan
    if: ${{ needs.plan.outputs.next_version != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for Cocogitto)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Cocogitto
        run: |
          set -euo pipefail
          COG_VERSION=7.0.0
          curl -fsSL \
            "https://github.com/cocogitto/cocogitto/releases/download/${COG_VERSION}/cocogitto-${COG_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o /tmp/cog.tar.gz
          COG_BIN="$(tar -tzf /tmp/cog.tar.gz | grep -E '(^|/)cog$' | head -1)"
          tar -xzf /tmp/cog.tar.gz -C /tmp
          install -Dm755 "/tmp/${COG_BIN}" /usr/local/bin/cog

      # Only the push-to-master path creates a release branch/PR. Manual
      # (workflow_dispatch) runs skip branching/bumping and only build/publish
      # the selected ref's current version.
      - name: Configure git
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.forgejo.org"

      - name: Create release branch, version commit and tag
        if: ${{ github.event_name == 'push' }}
        env:
          NEXT_VERSION: ${{ needs.plan.outputs.next_version }}
        run: |
          set -euo pipefail
          BRANCH="release/v${NEXT_VERSION}"
          git checkout -b "${BRANCH}"
          # Computes the version, bumps package files, regenerates CHANGELOG.md,
          # creates the vX.Y.Z tag + version commit on this branch.
          cog bump --auto
          echo "release_branch=${BRANCH}" >> "$GITHUB_ENV"
          echo "NEW_VERSION_TAG=v${NEXT_VERSION}" >> "$GITHUB_ENV"

      - name: Push release branch + tag
        if: ${{ github.event_name == 'push' }}
        env:
          NEXT_VERSION: ${{ needs.plan.outputs.next_version }}
          RELEASE_TOKEN: ${{ secrets.FORGEJO_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          SCHEME="${GITHUB_SERVER_URL%%://*}"
          HOST="${GITHUB_SERVER_URL#*://}"; HOST="${HOST%/}"
          echo "FORGEJO_HOST=${HOST}" >> "$GITHUB_ENV"
          git remote set-url origin \
            "${SCHEME}://x-access-token:${RELEASE_TOKEN}@${HOST}/darkkal/web-gallery.git"
          # New branch (allowed) + the vX.Y.Z tag (not branch-protected). The
          # version commit reaches master only when the release PR merges.
          git push origin "HEAD:release/v${NEXT_VERSION}"
          git push origin "v${NEXT_VERSION}"

      - name: Open release PR
        if: ${{ github.event_name == 'push' }}
        env:
          NEXT_VERSION: ${{ needs.plan.outputs.next_version }}
          RELEASE_TOKEN: ${{ secrets.FORGEJO_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          BODY="Automatic release PR created by the Forgejo release workflow. Merge to land v${NEXT_VERSION} (commit + tag already pushed)."
          PAYLOAD=$(python3 -c 'import json,sys;print(json.dumps({"title":sys.argv[1],"head":sys.argv[2],"base":"master","body":sys.argv[3]}))' \
            "chore(release): v${NEXT_VERSION}" "release/v${NEXT_VERSION}" "${BODY}")
          curl -fsS -X POST \
            "${GITHUB_SERVER_URL}/api/v1/repos/${{ github.repository }}/pulls" \
            -H "Authorization: token ${RELEASE_TOKEN}" -H 'Content-Type: application/json' \
            -d "${PAYLOAD}"

      - name: Build standalone binaries
        run: npm run build:release

      - name: Create release archives
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "NEW_VERSION_TAG=v${VERSION}" >> "$GITHUB_ENV"
          mkdir -p dist/release
          tar -czf "dist/release/web-gallery-v${VERSION}-linux-x64.tar.gz" -C dist "web-gallery-v${VERSION}-linux" setup-deps.sh
          tar -czf "dist/release/web-gallery-v${VERSION}-macos-x64.tar.gz" -C dist "web-gallery-v${VERSION}-macos" setup-deps.sh
          zip -j "dist/release/web-gallery-v${VERSION}-windows-x64.zip" "dist/web-gallery-v${VERSION}-win.exe" "dist/setup-deps.ps1"

      - name: Publish release + assets
        uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          url: ${{ github.server_url }}
          tag: ${{ env.NEW_VERSION_TAG }}
          token: ${{ secrets.FORGEJO_RELEASE_TOKEN || github.token }}
          direction: upload
          release-dir: dist/release
          override: true

      - name: Publish Docker image to Forgejo registry
        env:
          RELEASE_TOKEN: ${{ secrets.FORGEJO_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          REGISTRY="${FORGEJO_HOST}/darkkal/web-gallery"
          echo "${RELEASE_TOKEN}" | docker login "${FORGEJO_HOST}" -u "${{ github.actor }}" --password-stdin
          docker build -t "${REGISTRY}:${VERSION}" .
          docker tag "${REGISTRY}:${VERSION}" "${REGISTRY}:latest"
          docker push "${REGISTRY}:${VERSION}"
          docker push "${REGISTRY}:latest"
