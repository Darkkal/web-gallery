name: Release (Forgejo)

# Cocogitto-native releases (issue #160).
#
# Pushes to protected `master` (clean conventional commits landed via
# Rebase then fast-forward; no merge/squash subjects) are validated with
# `cog check`, then Cocogitto derives the next SemVer from
# commit subjects (`cog bump --auto`), bumps package manifests, regenerates
# CHANGELOG.md, and creates the version commit + vX.Y.Z tag. That version
# commit and tag are pushed ATOMICALLY to protected master by the dedicated
# release identity; binary assets and the registry image are published
# against the tag. Retries for an existing tag republish missing artefacts
# without computing another bump.
#
# Cutover note (#160): automatic push-triggered releases stay disabled until
# the owner enables them after v0.8.0 is manually dispatched and verified.
# Manual workflow_dispatch runs remain available at all times.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  # Pinned Cocogitto version + expected digest of its musl tarball. The
  # 7.0.0 GitHub release publishes no checksum sidecar (#160), so the
  # expected value is pinned here and verified locally after download.
  COG_VERSION: "7.0.0"
  COG_SHA256: "e03938ff2c4c86d71c00c0f3284dbbe95c5ca76fe34a51f33e945c23010d59bb"

jobs:
  # Decide whether a release is needed; an empty next_version skips the
  # entire release job (#161 review).
  plan:
    runs-on: ubuntu-latest
    outputs:
      next_version: ${{ steps.next.outputs.next_version }}
    steps:
      - name: Checkout (full history for Cocogitto)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Cocogitto (digest-verified)
        run: |
          set -euo pipefail
          BASE="https://github.com/cocogitto/cocogitto/releases/download/${COG_VERSION}"
          curl -fsSL "${BASE}/cocogitto-${COG_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o /tmp/cog.tar.gz
          printf '%s  %s\n' "${COG_SHA256}" /tmp/cog.tar.gz | sha256sum --check --strict -
          COG_BIN="$(tar -tzf /tmp/cog.tar.gz | grep -E '(^|/)cog$' | head -1)"
          tar -xzf /tmp/cog.tar.gz -C /tmp
          install -Dm755 "/tmp/${COG_BIN}" /usr/local/bin/cog

      # Validates that every commit since the latest reachable tag follows
      # the conventional contract and rejects retained fixup!/WIP commits.
      - name: Validate commit history
        run: cog check --from-latest-tag

      - name: Compute next version
        id: next
        run: |
          set -euo pipefail
          NEXT="$(cog bump --dry-run --auto 2>/dev/null | head -1 || true)"
          NEXT="${NEXT%%[[:space:]]*}"
          echo "next=${NEXT}"
          echo "next_version=${NEXT}" >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    # Manual dispatch always runs; push-triggered releases stay disabled until
    # the owner enables them after v0.8.0 (issue #160 cutover policy).
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (vars.RELEASES_ENABLED == 'true' && needs.plan.outputs.next_version != '')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Forgejo host
        run: |
          set -euo pipefail
          SCHEME="${GITHUB_SERVER_URL%%://*}"
          HOST="${GITHUB_SERVER_URL#*://}"; HOST="${HOST%/}"
          echo "FORGEJO_HOST=${HOST}" >> "$GITHUB_ENV"
          echo "FORGEJO_SCHEME=${SCHEME}" >> "$GITHUB_ENV"

      - name: Checkout (full history for Cocogitto)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Cocogitto (digest-verified)
        run: |
          set -euo pipefail
          BASE="https://github.com/cocogitto/cocogitto/releases/download/${COG_VERSION}"
          curl -fsSL "${BASE}/cocogitto-${COG_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o /tmp/cog.tar.gz
          printf '%s  %s\n' "${COG_SHA256}" /tmp/cog.tar.gz | sha256sum --check --strict -
          COG_BIN="$(tar -tzf /tmp/cog.tar.gz | grep -E '(^|/)cog$' | head -1)"
          tar -xzf /tmp/cog.tar.gz -C /tmp
          install -Dm755 "/tmp/${COG_BIN}" /usr/local/bin/cog

      # Fail fast with a clear message when release credentials are missing
      # instead of dying later inside git/docker with opaque auth errors.
      - name: Verify release credentials are configured
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_USER: ${{ secrets.RELEASE_USER }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TOKEN}" ]; then
            echo "::error::secret 'RELEASE_TOKEN' is not set or empty; the release push cannot authenticate"
            exit 1
          fi
          if [ -z "${RELEASE_USER}" ]; then
            echo "::error::secret 'RELEASE_USER' is not set or empty; required for the release identity and registry login"
            exit 1
          fi

      - name: Configure authenticated remote (dedicated release identity)
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_USER: ${{ secrets.RELEASE_USER }}
        run: |
          set -euo pipefail
          git remote set-url origin \
            "${FORGEJO_SCHEME}://${RELEASE_USER}:${RELEASE_TOKEN}@${FORGEJO_HOST%/}/${{ github.repository }}.git"

      - name: Configure deterministic release identity
        env:
          RELEASE_USER: ${{ secrets.RELEASE_USER }}
        run: |
          set -euo pipefail
          # The version commit must be authored by the dedicated release
          # account, not by whatever actor dispatched the workflow.
          git config user.name "${RELEASE_USER}"
          git config user.email "${RELEASE_USER}@users.noreply.${FORGEJO_HOST%/}"

      - name: Create atomic version commit + tag on master
        env:
          NEXT_VERSION: ${{ needs.plan.outputs.next_version }}
        run: |
          set -euo pipefail
          # Idempotency: an existing remote tag means a previous run already
          # released this version; only artefact republish remains.
          if git ls-remote --tags origin "refs/tags/v${NEXT_VERSION}" | grep -q .; then
            echo "Tag v${NEXT_VERSION} already exists; checking out its revision."
            git checkout "v${NEXT_VERSION}"
            echo "NEW_VERSION_TAG=v${NEXT_VERSION}" >> "$GITHUB_ENV"
            exit 0
          fi
          # Cocogitto bumps manifests, regenerates CHANGELOG.md, creates the
          # version commit and the vX.Y.Z tag on the current master head.
          cog bump --auto
          # Atomic delivery (#160): version commit and tag land together or
          # not at all, via the dedicated release identity.
          git push --atomic origin "HEAD:refs/heads/master" "v${NEXT_VERSION}"
          echo "NEW_VERSION_TAG=v${NEXT_VERSION}" >> "$GITHUB_ENV"

      - name: Build standalone binaries
        run: npm run build:release

      - name: Create release archives
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist/release
          tar -czf "dist/release/web-gallery-v${VERSION}-linux-x64.tar.gz" -C dist "web-gallery-v${VERSION}-linux" setup-deps.sh
          tar -czf "dist/release/web-gallery-v${VERSION}-macos-x64.tar.gz" -C dist "web-gallery-v${VERSION}-macos" setup-deps.sh
          zip -j "dist/release/web-gallery-v${VERSION}-windows-x64.zip" "dist/web-gallery-v${VERSION}-win.exe" "dist/setup-deps.ps1"

      - name: Publish release + assets
        uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          url: ${{ github.server_url }}
          tag: ${{ env.NEW_VERSION_TAG }}
          token: ${{ secrets.RELEASE_TOKEN }}
          direction: upload
          release-dir: dist/release
          override: true

      - name: Publish Docker image to Forgejo registry
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_USER: ${{ secrets.RELEASE_USER }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          REGISTRY="${FORGEJO_HOST%/}/${{ github.repository }}"
          echo "${RELEASE_TOKEN}" | docker login "${FORGEJO_HOST}" -u "${RELEASE_USER}" --password-stdin
          docker build -t "${REGISTRY}:${VERSION}" .
          docker tag "${REGISTRY}:${VERSION}" "${REGISTRY}:latest"
          docker push "${REGISTRY}:${VERSION}"
          docker push "${REGISTRY}:latest"
