name: Release (Forgejo)

# Forgejo is the release authority. Pushing to `master` runs Cocogitto
# (`cog bump --auto`), which computes the next SemVer from conventional
# commits, bumps package.json / package-lock.json, regenerates CHANGELOG.md,
# and creates the vX.Y.Z tag + release commit. Cocogitto's commit message starts
# with `chore(version):`, so a guard step below skips re-triggered runs on the
# version commit itself (avoids a release loop). The GitHub mirror only packages
# the resulting tag (see .github/workflows).
on:
  push:
    branches: [master]
  # Manual trigger for troubleshooting without merging: dispatches on any
  # branch and runs the build/publish path for the selected ref's current
  # version WITHOUT bumping versions or pushing to master.
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with full history for Cocogitto)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Skip release on the version commit
        id: version-guard
        run: |
          set -euo pipefail
          MSG="$(git log -1 --format=%s HEAD)"
          case "$MSG" in
            "chore(version):"*)
              echo "release triggered by the Cocogitto version commit — skipping"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Set up Node.js
        if: ${{ steps.version-guard.outputs.skip != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: ${{ steps.version-guard.outputs.skip != 'true' }}
        run: npm ci

      - name: Install Cocogitto
        if: ${{ steps.version-guard.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          COG_VERSION=7.0.0
          curl -fsSL \
            "https://github.com/cocogitto/cocogitto/releases/download/${COG_VERSION}/cocogitto-${COG_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o /tmp/cog.tar.gz
          # The release tarball wraps the binary in an arch triple dir (e.g.
          # x86_64-unknown-linux-musl/cog), so resolve its path from the archive
          # instead of assuming a fixed /tmp/cocogitto.
          COG_BIN="$(tar -tzf /tmp/cog.tar.gz | grep -E '(^|/)cog$' | head -1)"
          tar -xzf /tmp/cog.tar.gz -C /tmp
          install -Dm755 "/tmp/${COG_BIN}" /usr/local/bin/cog
          cog --version

      # Only the push-to-master path computes a version and pushes a release
      # commit/tag back. Manual (workflow_dispatch) runs must NOT bump versions
      # or touch master.
      - name: Configure git and authenticated remote
        if: ${{ github.event_name == 'push' && steps.version-guard.outputs.skip != 'true' }}
        env:
          RELEASE_TOKEN: ${{ secrets.FORGEJO_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          # Resolve the Forgejo instance from the runner-provided context so no
          # specific host is hardcoded in the repo. \`GITHUB_SERVER_URL\` is set by
          # Forgejo/Actions and points at the instance jobs can reach.
          SCHEME="${GITHUB_SERVER_URL%%://*}"
          HOST="${GITHUB_SERVER_URL#*://}"
          HOST="${HOST%/}"
          echo "FORGEJO_HOST=${HOST}" >> "$GITHUB_ENV"
          echo "FORGEJO_SERVER_URL=${GITHUB_SERVER_URL%/}" >> "$GITHUB_ENV"
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.forgejo.org"
          git remote set-url origin "${SCHEME}://x-access-token:${RELEASE_TOKEN}@${HOST}/darkkal/web-gallery.git"

      - name: Automatic version bump
        if: ${{ github.event_name == 'push' && steps.version-guard.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          # Computes the next version, bumps package files, regenerates
          # CHANGELOG.md, creates the vX.Y.Z tag + release commit, then pushes
          # them back to master (post_bump_hook in cog.toml).
          cog bump --auto

      - name: Build standalone binaries
        if: ${{ steps.version-guard.outputs.skip != 'true' }}
        run: npm run build:release

      - name: Create release archives
        if: ${{ steps.version-guard.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "NEW_VERSION_TAG=v${VERSION}" >> "$GITHUB_ENV"
          mkdir -p dist/release
          tar -czf "dist/release/web-gallery-v${VERSION}-linux-x64.tar.gz" -C dist "web-gallery-v${VERSION}-linux" setup-deps.sh
          tar -czf "dist/release/web-gallery-v${VERSION}-macos-x64.tar.gz" -C dist "web-gallery-v${VERSION}-macos" setup-deps.sh
          zip -j "dist/release/web-gallery-v${VERSION}-windows-x64.zip" "dist/web-gallery-v${VERSION}-win.exe" "dist/setup-deps.ps1"

      - name: Publish release + assets
        if: ${{ steps.version-guard.outputs.skip != 'true' }}
        uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          url: ${{ github.server_url }}
          tag: ${{ env.NEW_VERSION_TAG }}
          token: ${{ secrets.FORGEJO_RELEASE_TOKEN || github.token }}
          direction: upload
          release-dir: dist/release
          override: true

      - name: Publish Docker image to Forgejo registry
        if: ${{ steps.version-guard.outputs.skip != 'true' }}
        env:
          RELEASE_TOKEN: ${{ secrets.FORGEJO_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          REGISTRY="${FORGEJO_HOST}/darkkal/web-gallery"
          echo "${RELEASE_TOKEN}" | docker login "${FORGEJO_HOST}" -u "${{ github.actor }}" --password-stdin
          docker build -t "${REGISTRY}:${VERSION}" .
          docker tag "${REGISTRY}:${VERSION}" "${REGISTRY}:latest"
          docker push "${REGISTRY}:${VERSION}"
          docker push "${REGISTRY}:latest"
